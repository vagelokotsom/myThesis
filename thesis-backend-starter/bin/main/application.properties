# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/thesisdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.thesis.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# SSH Server Configuration
ssh.server.enabled=true
ssh.server.port=2222
ssh.server.host=0.0.0.0
ssh.server.hostkey.path=/tmp/hostkey.ser

# SSH Container Configuration
ssh.container.base-port=30000
ssh.container.namespace=default
ssh.container.image=thesis-ssh-container:latest
ssh.container.password.student=student123
ssh.container.password.root=rootpass123